<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brief — QA Eval</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0c0e;
    --panel: #121419;
    --panel-2: #171a20;
    --ink: #e7e9ed;
    --ink-dim: #9aa1ab;
    --ink-faint: #646b75;
    --ink-ghost: #3c424b;
    --accent: #d4895c;
    --accent-rgb: 212, 137, 92;
    --line: rgba(231, 233, 237, 0.07);
    --line-2: rgba(231, 233, 237, 0.13);
    --ok: #6fae7e;
    --sidebar-w: 232px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Inter", system-ui, sans-serif; height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased; font-size: 14px;
  }
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }

  .sidebar {
    border-right: 1px solid var(--line-2); background: var(--panel);
    display: flex; flex-direction: column;
  }
  .sb-brand {
    padding: 18px 20px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .sb-brand .logo { font-family: "Instrument Serif", Georgia, serif; font-size: 22px; }
  .sb-brand .logo .dot { color: var(--accent); }
  .sb-brand .tag {
    margin-left: auto; color: var(--ink-faint); border: 1px solid var(--line-2);
    border-radius: 4px; padding: 3px 7px;
    font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.14em;
  }
  .sb-section {
    padding: 18px 14px 6px; color: var(--ink-faint);
    font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase;
  }
  .sb-nav { padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
  .sb-link {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px;
    border-radius: 6px; color: var(--ink-dim); font-size: 13px;
    text-decoration: none; position: relative; transition: background .15s, color .15s;
  }
  .sb-link:hover { background: var(--panel-2); color: var(--ink); }
  .sb-link.active { background: var(--panel-2); color: var(--ink); }
  .sb-link.active::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 2px; border-radius: 2px; background: var(--accent);
  }

  .placeholder {
    flex: 1; display: grid; place-items: center; text-align: center; padding: 40px;
  }
  .ph-card { max-width: 420px; }
  .ph-ico {
    width: 48px; height: 48px; margin: 0 auto 20px; color: var(--ink-ghost);
    border: 1px solid var(--line-2); border-radius: 12px; display: grid; place-items: center;
  }
  .ph-card h2 { font-family: "Instrument Serif", Georgia, serif; font-size: 30px; font-weight: 400; margin: 0 0 10px; }
  .ph-card p { color: var(--ink-dim); font-size: 13.5px; line-height: 1.6; margin: 0; }
  .ph-tag {
    display: inline-block; margin-top: 18px;
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 14px;
  }

  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  .sb-toggle {
    width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center;
    color: var(--ink-faint); transition: background .15s, color .15s; flex-shrink: 0;
  }
  .sb-toggle:hover { background: var(--panel-2); color: var(--ink); }
  .sb-toggle svg { transition: transform .2s; }
  .app.sb-collapsed .sb-toggle svg { transform: rotate(180deg); }
  .app.sb-collapsed { grid-template-columns: 64px 1fr; }
  .app.sb-collapsed .sb-brand .logo,
  .app.sb-collapsed .sb-brand .tag { display: none; }
  .app.sb-collapsed .sb-brand { justify-content: center; padding: 18px 0 16px; }
  .app.sb-collapsed .sb-section { display: none; }
  .app.sb-collapsed .sb-link span:not(.sb-ico) { display: none; }
  .app.sb-collapsed .sb-link { justify-content: center; padding: 9px; }
  .app.sb-collapsed .sb-link.active::before { display: none; }
  .app.sb-collapsed .sb-nav { padding: 0 6px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="logo">Brief<span class="dot">.</span></span>
      <span class="tag">ADMIN</span>
      <button class="sb-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="sb-section">Evaluation</div>
    <nav class="sb-nav">
      <a class="sb-link" href="{{ url_for('admin.digest_eval', pw=pw) }}">
        <span class="sb-ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M5 6h6M5 8.5h4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></span>
        <span>Digest Eval</span>
      </a>
      <a class="sb-link active" href="{{ url_for('admin.qa_eval', pw=pw) }}">
        <span class="sb-ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 6.5a1.5 1.5 0 0 1 2.8.8c0 1-1.3 1.2-1.3 2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><circle cx="8" cy="11.5" r=".6" fill="currentColor"/></svg></span>
        <span>QA Eval</span>
      </a>
    </nav>
  </aside>

  <div class="placeholder">
    <div class="ph-card">
      <div class="ph-ico">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.4"/><path d="M8.6 8.6a2.4 2.4 0 0 1 4.4 1.3c0 1.5-2.1 1.8-2.1 3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="11" cy="16" r="0.9" fill="currentColor"/></svg>
      </div>
      <h2>QA Eval</h2>
      <p>Question-and-answer quality inspection lands in a later phase. This is where you'll review user questions, retrieved context, and the model's answers against the digest.</p>
      <span class="ph-tag">Not yet implemented</span>
    </div>
  </div>
</div>
<script>
function toggleSidebar() {
  var app = document.querySelector('.app');
  app.classList.toggle('sb-collapsed');
  localStorage.setItem('sb-collapsed', app.classList.contains('sb-collapsed') ? '1' : '0');
}
if (localStorage.getItem('sb-collapsed') === '1') {
  document.querySelector('.app').classList.add('sb-collapsed');
}
</script>
</body>
</html>
