<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief — Today's Briefing</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #111;
            --text: #e8e0d6;
            --text-muted: #9a9088;
            --text-faint: #6b635b;
            --text-dim: #4a443e;
            --accent: #c47a3a;
            --divider: #2a2520;
            --toggle-bg: #333;
        }

        body.light {
            --bg: #f5f0eb;
            --text: #1a1715;
            --text-muted: #6b635b;
            --text-faint: #9a9088;
            --text-dim: #b5ada5;
            --accent: #c47a3a;
            --divider: #d5cec6;
            --toggle-bg: #ccc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            padding: 40px 48px 60px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 64px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 400;
        }

        .theme-toggle {
            width: 44px;
            height: 24px;
            background: var(--toggle-bg);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }

        .theme-toggle::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            top: 3px;
            right: 3px;
            transition: right 0.3s;
        }

        body.light .theme-toggle::after {
            right: 23px;
        }

        .meta {
            text-align: center;
            margin-bottom: 20px;
        }

        .date-line {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 16px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 400;
            margin-bottom: 16px;
        }

        .title em {
            color: var(--accent);
            font-style: italic;
        }

        .categories-line {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .categories-line span {
            margin: 0 6px;
            color: var(--text-dim);
        }

        /* Cover image */
        .cover-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 32px 0;
        }

        .cover {
            width: min(50vw, 50vh);
            height: min(50vw, 50vh);
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--divider);
            background: var(--bg);
            position: relative;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 40% 40%, #2a1f16, #111 70%);
        }

        .cover-placeholder .orb {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #d4884a, #8b4d2a 60%, #3a1e0e);
            box-shadow: 0 0 60px rgba(196, 122, 58, 0.3), inset 0 -20px 40px rgba(0,0,0,0.4);
        }

        /* Audio player */
        .player {
            margin-top: auto;
            padding-top: 16px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1.5px solid var(--accent);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background: rgba(196, 122, 58, 0.15);
        }

        .play-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--accent);
        }

        .play-btn .pause-icon { display: none; }
        .play-btn.playing .play-icon { display: none; }
        .play-btn.playing .pause-icon { display: block; }

        .progress-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: var(--divider);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Brief</div>
            <button class="theme-toggle" aria-label="Toggle theme"></button>
        </div>

        <div class="meta">
            <div class="date-line">{{ date_display }}</div>
            <h1 class="title">Today's <em>briefing.</em></h1>
            <div class="categories-line">
                {% for cat in categories %}
                    {{ cat }}{% if not loop.last %}<span>&middot;</span>{% endif %}
                {% endfor %}
            </div>
        </div>

        <div class="cover-wrapper">
            <div class="cover">
                <div class="cover-placeholder">
                    <div class="orb"></div>
                </div>
            </div>
        </div>

        <div class="player">
            <div class="player-controls">
                <button class="play-btn" id="playBtn">
                    <svg class="play-icon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
                </button>
                <div class="progress-wrapper">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <audio id="audio" src="{{ audio_url }}" preload="metadata"></audio>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        playBtn.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playBtn.classList.remove('playing');
            }
        });

        audio.addEventListener('loadedmetadata', function() {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', function() {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = pct + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('ended', function() {
            playBtn.classList.remove('playing');
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
        });

        progressBar.addEventListener('click', function(e) {
            const rect = progressBar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        });

        const toggle = document.querySelector('.theme-toggle');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
        }
        toggle.addEventListener('click', function() {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
        });
    </script>
</body>
</html>
