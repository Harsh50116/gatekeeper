<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Digest — Register</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
        h1 { font-size: 1.5rem; }
        label { display: block; margin: 8px 0; }
        input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .checkbox-group { margin: 16px 0; }
        button { padding: 10px 24px; cursor: pointer; }
        .error { color: #c00; margin: 12px 0; }
    </style>
</head>
<body>
    <h1>Morning Digest</h1>
    <p>Enter your email and pick the categories you want in your daily digest.</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/register">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required>

        <div class="checkbox-group">
            {% for cat in categories %}
            <label>
                <input type="checkbox" name="categories" value="{{ cat }}"
                    {% if cat in selected %}checked{% endif %}>
                {{ cat | replace("_", " ") | title }}
            </label>
            {% endfor %}
        </div>

        <button type="submit">Register</button>
    </form>
</body>
</html>
